<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Shows</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.css">
</head>

<body>

    <div>
        <div style="display: flex; justify-content: space-between;">
             <h1>TV Shows</h1>
             <div style="display: flex; gap: 12px; align-items: center;">
                <p id="user-greeting"></p>
                <button onclick="logout()">Logout</button>
             </div>
        </div>

        <div id="show-filters">
            <button onclick="showAll()">All Shows</button>
            <button onclick="showFavorites()">Favorites</button>
            <input id="search-input" type="text" placeholder="Search tv show">
            <button onclick="searchShows()">Search</button>
        </div>
    </div>

    <div id="shows-container">

    </div>

    <script defer src="script.js"></script>
</body>

</html>
